<div style="font-family: Arial, sans-serif; font-size: 14px;">
    <p>#textoInicio</p>
    <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;">
        <tr>
            <td style="border: 1px solid black; padding: 8px; font-weight: bold;">BUQUE:</td>
            <td style="border: 1px solid black; padding: 8px;">#buque</td>
        </tr>
        <tr>
            <td style="border: 1px solid black; padding: 8px; font-weight: bold;">TOTAL DEL TURNO:</td>
            <td style="border: 1px solid black; padding: 8px;">#totalTurno</td>
        </tr>
        <tr>
            <td style="border: 1px solid black; padding: 8px; font-weight: bold;">TOTAL GENERADO CARGADO:</td>
            <td style="border: 1px solid black; padding: 8px;">#totalCargado</td>
        </tr>
        <tr>
            <td style="border: 1px solid black; padding: 8px; font-weight: bold;">PEDIDO POR PLANO:</td>
            <td style="border: 1px solid black; padding: 8px;">#pedidoPorPlano</td>
        </tr>
        <tr>
            <td style="border: 1px solid black; padding: 8px; font-weight: bold;">RESTA EMBARCAR:</td>
            <td style="border: 1px solid black; padding: 8px;">#restaEmbarcar</td>
        </tr>
        <tr>
            <td style="border: 1px solid black; padding: 8px; font-weight: bold;">VIENTO:</td>
            <td style="border: 1px solid black; padding: 8px;">#viento</td>
        </tr>
    </table>
    <table style="width: 100%; border-collapse: collapse;">
        <thead>
            <tr>
                <th style="border: 1px solid black; padding: 8px; text-align: left;">FECHA</th>
                <th style="border: 1px solid black; padding: 8px; text-align: left;">TURNOS</th>
                <th style="border: 1px solid black; padding: 8px; text-align: left;">COMENTARIOS</th>
            </tr>
        </thead>
        <tbody>
            <!-- Placeholder for records -->
            {Registros}
        </tbody>
    </table>
    <table>
        <thead>
            <tr>
                <th style="border: 1px solid black; padding: 8px; text-align: center;" colspan="4">HORARIOS</th>
            </tr>
            <tr>
                <th style="border: 1px solid black; padding: 8px; text-align: left;">EXPORTADOR</th>
                <th style="border: 1px solid black; padding: 8px; text-align: left;">COMENZÓ</th>
                <th style="border: 1px solid black; padding: 8px; text-align: left;">FINALIZÓ</th>
                <th style="border: 1px solid black; padding: 8px; text-align: left;">TOTAL A BORDO</th>
            </tr>
        </thead>
        <tbody>
            {Horarios}
        </tbody>
    </table>
</div>
