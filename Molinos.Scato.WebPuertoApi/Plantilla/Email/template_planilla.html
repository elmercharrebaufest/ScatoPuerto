<div style="font-family: Arial, sans-serif; font-size: 14px;">
    {PeriodoCarga}
    <table>
        <thead>
            <tr>
                <th style="border: 1px solid black; padding: 8px; text-align: left;">BUQUE</th>
                <th style="border: 1px solid black; padding: 8px; text-align: left;">{Buque}</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td style="border: 1px solid black; padding: 8px; text-align: left;">Total del Turno</td>
                <td style="border: 1px solid black; padding: 8px; text-align: left;">{TotalTurno}</td>
            </tr>
            <tr>
                <td style="border: 1px solid black; padding: 8px; text-align: left;">Total general cargado</td>
                <td style="border: 1px solid black; padding: 8px; text-align: left;">{TotalCargado}</td>
            </tr>
                {FilaTotalPlano}

                {FilaRestaCargar}
            <tr>
                <td style="border: 1px solid black; padding: 8px; text-align: left;">VIENTO</td>
                <td style="border: 1px solid black; padding: 8px; text-align: left;">{Viento}</td>
            </tr>
        </tbody>
    </table>
    <table>
        <thead>
            <tr>
                <th style="border: 1px solid black; padding: 8px; text-align: left;">Fecha</th>
                <th style="border: 1px solid black; padding: 8px; text-align: left;">Turnos</th>
                <th style="border: 1px solid black; padding: 8px; text-align: left;">Comentarios</th>
            </tr>
        </thead>
        <tbody>
            {Turnos}
        </tbody>
    </table>
    <table>
        <thead>
            <tr>
                <th style="border: 1px solid black; padding: 8px; text-align: center;" colspan="5">HORARIOS</th>
            </tr>
            <tr>
                <th style="border: 1px solid black; padding: 8px; text-align: left;">EXPORTADOR</th>
                <th style="border: 1px solid black; padding: 8px; text-align: left;">DESTINO</th>
                <th style="border: 1px solid black; padding: 8px; text-align: left;">MERCADERÍA</th>
                <th style="border: 1px solid black; padding: 8px; text-align: left;">COMENZÓ</th>
                <th style="border: 1px solid black; padding: 8px; text-align: left;">FINALIZÓ</th>
                <th style="border: 1px solid black; padding: 8px; text-align: left;">TOTAL A BORDO</th>
            </tr>
        </thead>
        <tbody>
            {Horarios}
        </tbody>
    </table>
</div>
