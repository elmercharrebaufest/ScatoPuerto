<form [formGroup]="filtroForm" (ngSubmit)="aplicarFiltro()" id="filtroCargas">
  <div class="row" *ngIf="modo === 'embarques-por-buques'">
    <div class="form-group col-md-2">
      <input type="text" class="form-control colorGris" formControlName="Vapor" placeholder="Vapor" />
    </div>
    <div class="form-group col-md-2">
      <input type="text" class="form-control colorGris" formControlName="Bodega" placeholder="Bodega" />
    </div>
    <div class="form-group col-md-2">
      <select class="form-control colorGris" formControlName="Exportador_Id">
        <option [ngValue]="null" disabled selected>Exportador</option>
        <option [ngValue]="null">TODOS</option>
        <option *ngFor="let exp of exportadores" [ngValue]="exp.Id">{{ exp.Descripcion }}</option>
      </select>
    </div>
    <div class="form-group col-md-2">
      <select class="form-control colorGris" formControlName="Material_Id">
        <option [ngValue]="null" disabled selected>Producto</option>
        <option [ngValue]="null">TODOS</option>
        <option *ngFor="let mat of materiales" [ngValue]="mat.Id">{{ mat.Descripcion }}</option>
      </select>
    </div>
    <div class="form-group col-md-2 input_img">
      <input type="date" placeholder="Fecha desde" class="form-control colorGris" formControlName="FechaDesde" />
    </div>
    <div class="form-group col-md-2 input_img">
      <input type="date" placeholder="Fecha hasta" class="form-control colorGris" formControlName="FechaHasta" />
    </div>
    <div class="form-group col-md-12">
      <button class="btn btn-buscar mr-2" type="submit">
        Buscar
      </button>
      <button class="btn btn-limpiar" type="button" (click)="limpiarFiltro()">
        Limpiar
      </button>
    </div>
  </div>

  <div class="row" *ngIf="modo === 'embarques'">
    <div class="form-group col-md-2">
      <input type="text" class="form-control colorGris" formControlName="NumeroBalanza" placeholder="N° Balanza" />
    </div>
    <div class="form-group col-md-2">
      <input type="number" class="form-control colorGris" formControlName="Id" placeholder="ID Carga" />
    </div>
    <div class="form-group col-md-2">
      <input type="text" class="form-control colorGris" formControlName="VaporDesc" placeholder="Vapor" />
    </div>
    <div class="form-group col-md-2">
      <input type="text" class="form-control colorGris" formControlName="BodegaDesc" placeholder="Bodega" />
    </div>
    <div class="form-group col-md-2">
      <input type="text" class="form-control colorGris" formControlName="DestinoDesc" placeholder="Destino" />
    </div>
    <div class="form-group col-md-2">
      <input type="text" class="form-control colorGris" formControlName="ExportadorDesc" placeholder="Exportador" />
    </div>
    <div class="form-group col-md-2">
      <input type="text" class="form-control colorGris" formControlName="MaterialDesc" placeholder="Material" />
    </div>
    <div class="form-group col-md-2 input_img">
      <input type="date" placeholder="Fecha desde" class="form-control colorGris" formControlName="FechaDesde" />
    </div>
    <div class="form-group col-md-2 input_img">
      <input type="date" placeholder="Fecha hasta" class="form-control colorGris" formControlName="FechaHasta" />
    </div>
    <div class="form-group col-md-12">
      <button class="btn btn-buscar mr-2" type="submit">
        Buscar
      </button>
      <button class="btn btn-limpiar" type="button" (click)="limpiarFiltro()">
        Limpiar
      </button>
    </div>
  </div>
</form>
