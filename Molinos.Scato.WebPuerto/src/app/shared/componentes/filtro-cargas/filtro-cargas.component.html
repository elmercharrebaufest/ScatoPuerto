<form [formGroup]="filtroForm" (ngSubmit)="aplicarFiltro()" id="filtroCargas">
  <div class="row" *ngIf="modo === 'embarques-por-buques'">
    <div class="form-group col-md-2">
      <input type="text" class="form-control colorGris" formControlName="Vapor" placeholder="Vapor" />
    </div>
    <div class="form-group col-md-2">
      <input type="text" class="form-control colorGris" formControlName="Bodega" placeholder="Bodega" />
    </div>
    <div class="form-group col-md-2">
      <select class="form-control colorGris" formControlName="Exportador_Id">
        <option [ngValue]="null" disabled selected>Exportador</option>
        <option [ngValue]="null">TODOS</option>
        <option *ngFor="let exp of exportadores" [ngValue]="exp.Id">{{ exp.Descripcion }}</option>
      </select>
    </div>
    <div class="form-group col-md-2">
      <select class="form-control colorGris" formControlName="Material_Id">
        <option [ngValue]="null" disabled selected>Producto</option>
        <option [ngValue]="null">TODOS</option>
        <option *ngFor="let mat of materiales" [ngValue]="mat.Id">{{ mat.Descripcion }}</option>
      </select>
    </div>
    <div class="form-group col-md-2 input_img">
      <input type="date" placeholder="Fecha desde" class="form-control colorGris" formControlName="FechaDesde" />
    </div>
    <div class="form-group col-md-2 input_img">
      <input type="date" placeholder="Fecha hasta" class="form-control colorGris" formControlName="FechaHasta" />
    </div>
    <div class="form-group col-md-12">
      <button class="btn btn-buscar mr-2" type="submit">
        Buscar
      </button>
      <button class="btn btn-limpiar" type="button" (click)="limpiarFiltro()">
        Limpiar
      </button>
    </div>
  </div>

  <div *ngIf="modo === 'embarques'">
    <div class="row">
      <!-- Fila 1: N° Balanza | Buque | Pesada Específica -->
      <div class="form-group col-md-4">
        <div class="row align-items-center">
          <label class="col-md-5 col-form-label text-right">Número Balanza</label>
          <div class="col-md-7">
            <select class="form-control colorGris" formControlName="NumeroBalanza">
              <option [ngValue]="null">TODAS</option>
              <option *ngFor="let b of balanzasPuerto" [value]="b">{{ b }}</option>
            </select>
          </div>
        </div>
      </div>
      <div class="form-group col-md-4">
        <div class="row align-items-center">
          <label class="col-md-5 col-form-label text-right">Buque</label>
          <div class="col-md-7">
            <input type="text" class="form-control colorGris"
                   formControlName="Vapor"
                   [ngbTypeahead]="searchVapor"
                   [inputFormatter]="formatterNombre"
                   [resultFormatter]="formatterNombre"
                   [class.is-invalid]="tieneValorInvalido('Vapor')"
                   placeholder="" />
          </div>
        </div>
      </div>
      <div class="form-group col-md-4">
        <div class="row align-items-center">
          <label class="col-md-5 col-form-label text-right">Pesada Específica</label>
          <div class="col-md-7">
            <input type="number" class="form-control colorGris" formControlName="Id" placeholder="" />
          </div>
        </div>
      </div>
    </div>

    <div class="row">
      <!-- Fila 2: Bodega | Destino | Desde -->
      <div class="form-group col-md-4">
        <div class="row align-items-center">
          <label class="col-md-5 col-form-label text-right">Bodega</label>
          <div class="col-md-7">
            <input type="text" class="form-control colorGris"
                   formControlName="Bodega"
                   [ngbTypeahead]="searchBodega"
                   [inputFormatter]="formatterNombre"
                   [resultFormatter]="formatterNombre"
                   [class.is-invalid]="tieneValorInvalido('Bodega')"
                   placeholder="" />
          </div>
        </div>
      </div>
      <div class="form-group col-md-4">
        <div class="row align-items-center">
          <label class="col-md-5 col-form-label text-right">Destino</label>
          <div class="col-md-7">
            <input type="text" class="form-control colorGris"
                   formControlName="Destino"
                   [ngbTypeahead]="searchDestino"
                   [inputFormatter]="formatterNombre"
                   [resultFormatter]="formatterNombre"
                   [class.is-invalid]="tieneValorInvalido('Destino')"
                   placeholder="" />
          </div>
        </div>
      </div>
      <div class="form-group col-md-4">
        <div class="row align-items-center">
          <label class="col-md-5 col-form-label text-right">Desde</label>
          <div class="col-md-7">
            <input type="date" class="form-control colorGris" formControlName="FechaDesde" />
          </div>
        </div>
      </div>
    </div>

    <div class="row">
      <!-- Fila 3: Exportador | Commodity | Hasta -->
      <div class="form-group col-md-4">
        <div class="row align-items-center">
          <label class="col-md-5 col-form-label text-right">Exportador</label>
          <div class="col-md-7">
            <input type="text" class="form-control colorGris"
                   formControlName="Exportador"
                   [ngbTypeahead]="searchExportador"
                   [inputFormatter]="formatterNombre"
                   [resultFormatter]="formatterNombre"
                   [class.is-invalid]="tieneValorInvalido('Exportador')"
                   placeholder="" />
          </div>
        </div>
      </div>
      <div class="form-group col-md-4">
        <div class="row align-items-center">
          <label class="col-md-5 col-form-label text-right">Material</label>
          <div class="col-md-7">
            <input type="text" class="form-control colorGris"
                   formControlName="Material"
                   [ngbTypeahead]="searchMaterial"
                   [inputFormatter]="formatterMaterial"
                   [resultFormatter]="formatterMaterial"
                   [class.is-invalid]="tieneValorInvalido('Material')"
                   placeholder="" />
          </div>
        </div>
      </div>
      <div class="form-group col-md-4">
        <div class="row align-items-center">
          <label class="col-md-5 col-form-label text-right">Hasta</label>
          <div class="col-md-7">
            <input type="date" class="form-control colorGris" formControlName="FechaHasta" />
          </div>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-md-12 text-right">
        <button class="btn btn-limpiar mr-2" type="button" (click)="limpiarFiltro()">Limpiar</button>
        <button class="btn btn-buscar" type="submit">Filtrar</button>
      </div>
    </div>
  </div>
</form>
