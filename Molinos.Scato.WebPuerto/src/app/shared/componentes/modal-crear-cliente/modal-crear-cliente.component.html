



<ship-spinner [message]="mensajeCliente" *ngIf='mostrarSpinner'></ship-spinner>
<form [formGroup]="crearEditarClienteForm">
    <div class='modal-header'>
        <h4 class="modal-title">{{tituloModal}}</h4>
    </div>
    <div class='modal-body '>
        <div class="row margen font-weight-bold">
            <div class="col pt-4">
                <label class="">Nombre</label>
                <input type="text" class="form-control" maxlength="60" placeholder="Ingrese un nombre" formControlName="nombre" (input)="onInputNombreCliente($event)"/>
            </div>
        </div>
        <br>
    </div>
    <div class='modal-footer justify-content-center'>
        <div class="">
            <button type="button" class="btn btn-danger mx-5" (click)="onResetForm()">Cancelar</button>
            <button type="button" class="btn btn-success mx-5" (click)="onCrearCliente()">Guardar</button>
        </div>
    </div>
</form>
