<div class="container-fluid">
  <div class="row">
    <div class="col-md-8">
      <label class="titulo">Configuracion de Puerto - Bodegas</label>
    </div>
    <div class="col-md-4 text-right">
      <button class="btn btn-buscar btn-accion" (click)="onNuevo()">
        <i class="fa fa-plus mr-1"></i> Nueva bodega
      </button>
    </div>
  </div>
  <div class="row mb-3 mt-2">
    <div class="col-md-4">
      <div class="input-group">
        <input type="text" class="form-control colorGris" [(ngModel)]="filtroTexto"
          placeholder="Buscar por descripcion..." (keyup.enter)="onBuscar()" />
        <div class="input-group-append">
          <button class="btn btn-buscar" (click)="onBuscar()"><i class="fa fa-search"></i></button>
          <button class="btn btn-limpiar" (click)="onLimpiar()"><i class="fa fa-times"></i></button>
        </div>
      </div>
    </div>
  </div>

  <ship-spinner message="Cargando datos" *ngIf="cargando"></ship-spinner>
  <div class="table-responsive" *ngIf="!cargando">
    <table class="table table-bordered custom-table">
      <colgroup>
        <col class="col-data">
        <col class="col-acciones">
      </colgroup>
      <thead>
        <tr>
          <th tabindex="0" (click)="onOrdenar('Nombre')">
            <div class="head">
              <span>Descripcion</span>
              <span>
                <i [ngClass]="{'fa': true, 'fa-solid fa-sort-up': true, 'arrow': true, 'unselected': ordenarPor === 'Nombre' && dirOrden === 'Asc'}"></i>
                <i [ngClass]="{'fa': true, 'fa-solid fa-sort-down': true, 'arrow': true, 'unselected': ordenarPor === 'Nombre' && dirOrden === 'Desc'}"></i>
              </span>
            </div>
          </th>
          <th class="col-acciones">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of items; let i = index" [class.fila-par]="i % 2 !== 0">
          <td>{{ item.Nombre }}</td>
          <td class="col-acciones">
            <button class="btn btn-sm btn-warning mr-1"
              [disabled]="esBodegaNoEditable(item)"
              [title]="esBodegaNoEditable(item) ? 'Las bodegas 1 a 9 no son editables' : 'Editar'"
              (click)="onEditar(item)">
              <i class="fa fa-edit"></i>
            </button>
            <button class="btn btn-sm btn-danger"
              [disabled]="esBodegaNoEditable(item)"
              [title]="esBodegaNoEditable(item) ? 'Las bodegas 1 a 9 no son eliminables' : 'Eliminar'"
              (click)="onEliminar(item)">
              <i class="fa fa-trash"></i>
            </button>
          </td>
        </tr>
        <tr *ngIf="items?.length === 0">
          <td colspan="2" class="text-center text-muted">Sin resultados</td>
        </tr>
      </tbody>
    </table>
  </div>
  <mat-paginator #paginator (page)="onPage($event)" [length]="itemsTotales" [showFirstLastButtons]="true"
    [pageSize]="10" [pageSizeOptions]="[10, 20, 50, 100]"></mat-paginator>
</div>
