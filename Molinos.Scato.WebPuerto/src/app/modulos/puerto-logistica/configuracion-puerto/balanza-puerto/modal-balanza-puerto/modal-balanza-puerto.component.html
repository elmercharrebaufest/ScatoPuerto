<div class="modal-header">
  <h4 class="modal-title">{{ titulo }}</h4>
  <button type="button" class="close" aria-label="Cerrar" (click)="cancelar()">
    <span aria-hidden="true">&times;</span>
  </button>
</div>
<form [formGroup]="form" (ngSubmit)="guardar()" novalidate>
  <div class="modal-body">
    <div class="row">
    <div class="form-group col-md-6">
      <label>Número Balanza</label>
      <input type="text" class="form-control"
             formControlName="CodigoBalanza"
             [ngClass]="{'is-invalid': form.get('CodigoBalanza').touched && form.get('CodigoBalanza').invalid}" />
      <div class="invalid-feedback" *ngIf="form.get('CodigoBalanza').touched && form.get('CodigoBalanza').hasError('required')">
        El número de balanza es requerido.
      </div>
    </div>
    <div class="form-group col-md-6">
      <label>Código</label>
      <ng-container *ngIf="esBalanzaRestringida; else selectCodigo">
        <input type="text" class="form-control" [value]="codigoDispositivoDescripcion" readonly />
      </ng-container>
      <ng-template #selectCodigo>
        <select class="form-control" formControlName="CodigoDispositivo"
                [ngClass]="{'is-invalid': form.get('CodigoDispositivo').touched && form.get('CodigoDispositivo').invalid}">
          <option [ngValue]="null">(ninguno)</option>
          <option *ngFor="let d of codigosDispositivos" [ngValue]="d.codigo">{{ d.descripcion }}</option>
        </select>
        <div class="invalid-feedback" *ngIf="form.get('CodigoDispositivo').touched && form.get('CodigoDispositivo').hasError('required')">
          El código es requerido.
        </div>
      </ng-template>
    </div>
    <div class="form-group col-md-4">
      <label>Última Validación</label>
      <input type="number" class="form-control" formControlName="UltimaValidacion" min="0"
             [ngClass]="{'is-invalid': form.get('UltimaValidacion').touched && form.get('UltimaValidacion').invalid}" />
      <div class="invalid-feedback" *ngIf="form.get('UltimaValidacion').touched && form.get('UltimaValidacion').hasError('required')">
        La última validación es requerida.
      </div>
      <div class="invalid-feedback" *ngIf="form.get('UltimaValidacion').touched && form.get('UltimaValidacion').hasError('min')">
        El valor debe ser mayor o igual a 0.
      </div>
    </div>
    <div class="form-group col-md-4">
      <label>OffSet PLC</label>
      <input type="number" class="form-control" formControlName="OffSetPlc" min="0"
             [ngClass]="{'is-invalid': form.get('OffSetPlc').touched && form.get('OffSetPlc').invalid}" />
      <div class="invalid-feedback" *ngIf="form.get('OffSetPlc').touched && form.get('OffSetPlc').hasError('required')">
        El Offset PLC es requerido.
      </div>
      <div class="invalid-feedback" *ngIf="form.get('OffSetPlc').touched && form.get('OffSetPlc').hasError('min')">
        El valor debe ser mayor o igual a 0.
      </div>
    </div>
    <div class="form-group col-md-4">
      <label>Intentos de validación</label>
      <input type="number" class="form-control" formControlName="IntentosValidacion" min="1"
             [ngClass]="{'is-invalid': form.get('IntentosValidacion').touched && form.get('IntentosValidacion').invalid}" />
      <div class="invalid-feedback" *ngIf="form.get('IntentosValidacion').touched && form.get('IntentosValidacion').hasError('required')">
        Los intentos de validación son requeridos.
      </div>
      <div class="invalid-feedback" *ngIf="form.get('IntentosValidacion').touched && form.get('IntentosValidacion').hasError('min')">
        El valor debe ser mayor a 0.
      </div>
    </div>
      <div class="form-group col-md-12 d-flex align-items-center mt-1">
        <div class="form-check">
          <input type="checkbox" class="form-check-input" formControlName="Administrativa" id="adminCheck" />
          <label class="form-check-label" for="adminCheck">Administrativa</label>
        </div>
      </div>
    </div>
    </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="cancelar()" [disabled]="guardando">Cancelar</button>
    <button type="submit" class="btn btn-primary" [disabled]="guardando || form.invalid">
      {{ guardando ? 'Guardando...' : 'Guardar' }}
    </button>
  </div>
</form>
