<div class="container-fluid">
    <div class="row">
        <div class="col-md-9">
            <label class="cargando-clientes">Cargadores / Exportadores</label>
        </div>
        <div class="col-md-3">
            <button class="btn btn-outline-secondary" (click)="onVolver()">
                < VOLVER </button>&nbsp;
            <button class="btn btn-success" (click)="agregarCargador(addCargador)">NUEVO EXPORTADOR</button>
        </div>
    </div>
    <div class="row">
        <div class="col-md-12">
            <ship-spinner [message]="'Cargando exportadores/cargadores... Por favor, espere...'"
                *ngIf='estaCargando'></ship-spinner>
            <form id="filtroId" [formGroup]="filtro">
                <div class="row">
                    <div class="form-group col-md-2 colorGris">
                        <input type="text" class="form-control" placeholder="Nombre" formControlName="nombre">
                    </div>
                    <div class="form-group col-md-2">
                        <button class="btn buscar" (click)="onBuscar()">Buscar</button>
                    </div>
                    <div class="form-group col-md-4">
                        <button class="btn limpiar" (click)="onLimpiarFiltros()">Limpiar Búsqueda</button>
                        <button class="btn exportar" (click)="onExportExcel()">Exportar EXCEL</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div class="row">
        <div class="col-md-12">
            <div style="overflow-x:auto; " class="table-responsive tableFixHead">
                <table class='table table-bordered lista-pe-table'
                    style="border-spacing: 0px 0.5rem; border-collapse: separate;">
                    <thead class="lista-pe-header tamanioHeader">
                        <tr>
                            <th style="border-radius: 5px 0px 0px 0px;" tabindex="0" rowspan="1" colspan="1"
                                class="noBorder" (click)="orderColumnBy('nombre')">
                                <div class="head noBorder">
                                    Nombre
                                    <span><i
                                            [ngClass]="{'fa': true, 'fa-solid fa-sort-up': true, 'arrow': true, 'unselected': orderedByColumn === 'nombre' && orderDirection > 0 }"></i>
                                        <i
                                            [ngClass]="{'fa': true, 'fa-solid fa-sort-down': true, 'arrow': true, 'unselected': orderedByColumn === 'nombre' && orderDirection < 0 }"></i>
                                    </span>
                                </div>
                            </th>
                            <th class="noBorder" style=" border-radius: 0px 0px 0px 0px;"></th>
                            <th class="noBorder" style=" border-radius: 0px 8px 0px 0px;"></th>
                        </tr>
                    </thead>
                    <tbody *ngFor="let cargador of cargadores" style="text-align: center;">
                        <tr style="background-color: white; box-shadow: 1px 2px 6px #cccccc" class="lista-buque-row">
                            <td class="noBorder-rigth centradoHorizontal">{{cargador.nombre}}</td>
                            <td class="noBorder centradoHorizontal" *ngIf='tienePermisoModificarCargador()'
                               (click)="editarCargador(cargador.id, addCargador)">
                                <div class='icon-editar cursor'></div>
                            </td>
                            <td class="noBorder centradoHorizontal" *ngIf='tienePermisoEliminarCargador()'
                                (click)="eliminarCargador(cargador)">
                                <div class='icon-eliminar cursor'></div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <mat-paginator #paginator class="demo-paginator" (page)="handlePageEvent($event)" [length]="length"
                [pageSize]="pageSize" [disabled]="disabled" [showFirstLastButtons]="showFirstLastButtons"
                [pageSizeOptions]="showPageSizeOptions ? pageSizeOptions : []" [hidePageSize]="hidePageSize"
                [pageIndex]="pageIndex" aria-label="Select page">
            </mat-paginator>
        </div>
    </div>
</div>

<ng-template #addCargador let-modal>
    <app-editar-crear-cargador [id]="id" (cerrar)="modal.dismiss()" (refrescarListado)="refrescarListado($event)"></app-editar-crear-cargador>
</ng-template>
