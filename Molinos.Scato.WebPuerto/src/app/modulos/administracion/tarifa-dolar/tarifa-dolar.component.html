<div class="container-fluid p-2">
    <ship-spinner [message]="'Cargando...'" *ngIf='estaCargando'></ship-spinner>

    <div class="row pt-2 pb-3">
        <div class="col text-left">
            <a class="btn btn-link px-0 text-primary" (click)="onVolver()" style="cursor: pointer; font-weight: 500;">← VOLVER</a>
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-12">
            <h1 class="titulo-pagina">Cotización dólar</h1>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <form [formGroup]="formulario">
                        
                        <div class="form-group mb-4">
                            <label class="form-label"><strong>Período</strong></label>
                            <input type="month" 
                                   class="form-control" 
                                   formControlName="periodo"
                                   (change)="onSeleccionarPeriodo()">
                        </div>

                        <div class="form-group mb-4">
                            <label class="form-label"><strong>Cotización</strong></label>
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text font-weight-bold">$</span>
                                </div>
                                <input type="number" 
                                       class="form-control text-right form-control-lg input-cotizacion" 
                                       formControlName="cotizacion"
                                       step="0.01"
                                       placeholder="0.00"
                                       (keypress)="numberWithTwoDecimals($event, $event.target.value)">
                            </div>
                            <div class="mt-2 text-muted small" *ngIf="tarifaDolar?.fechaActualizacion">
                                <strong>Última actualización al {{ tarifaDolar.fechaActualizacion | date:'d/M/yyyy' }}</strong>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end mt-4 pt-2 gap-2">
                            <button class="btn btn-cancelar px-4" 
                                    type="button" 
                                    (click)="onCancelar()">
                                Cancelar
                            </button>
                            <button class="btn btn-primary px-4" 
                                    type="button" 
                                    (click)="onGuardar()"
                                    [disabled]="estaCargando || !puedeEditar">
                                Guardar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
