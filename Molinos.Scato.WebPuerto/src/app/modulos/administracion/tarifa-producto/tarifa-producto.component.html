<ship-spinner [message]="mensaje" *ngIf="estaCargando"></ship-spinner>

<form [formGroup]="filtrosForm">
    <div class="container-fluid px-4">
        <div class="row mb-3">
            <div class="col">
                <a href="#" class="text-primary" (click)="onVolver()">← VOLVER</a>
            </div>
        </div>
        <div class="row mb-3">
            <div class="col-md-10">
                <label class="titulo">Tarifas por Producto</label>
            </div>
        </div>
        <div class="row mb-4 bg-form">
            <div class="col-md-3">
                <label for="periodo">Período</label>
                <input id="periodo" type="month" class="form-control" formControlName="periodo" />
            </div>
            <div class="col-md-3">
                <label for="producto">Producto</label>
                <select id="producto" class="form-control" formControlName="materialPuerto">
                    <option value="" disabled selected>Seleccione un producto</option>
                    <option *ngFor="let material of materiales" [ngValue]="material">
                        {{ material.descripcion }}
                    </option>
                </select>
            </div>
            <div class="col-md-3 mt-4">
                <button type="button" class="btn btn-primary" (click)="onBuscarTarifaProducto()">Buscar</button>
            </div>
        </div>
    </div>
</form>
<form [formGroup]="tarifaForm">

    <div class="col-md-12">
        <h5>{{msjTarifa}}</h5>
    </div>
    <div class="container-fluid px-4">
        <div class="row mb-3 bg-form">
            <div class="col-md-4">
                <h5 class="font-weight-bold">Ingresos</h5>
                <ng-container *ngFor="let concepto of conceptosIngresoFormArray.controls; let i = index">
                    <div [formGroup]="concepto" class="form-group">
                        <label>{{ concepto.get('concepto.descripcion')?.value}}</label>
                        <div class="input-group mb-3">
                            <div class="input-group-prepend">
                                <div class="input-group-text">
                                    <input type="checkbox" formControlName="seleccionado"
                                        aria-label="Checkbox for following text input">
                                </div>
                            </div>
                            <div class="input-group-prepend">
                                <span class="input-group-text" id="basic-addon1">{{
                                    concepto.get('concepto.moneda.descripcion')?.value == "Dolares" ? "USD": "ARS"
                                    }}</span>
                            </div>
                            <input type="text" class="form-control" placeholder="Ingrese valor"
                                (keypress)="numberWithTwoDecimals($event, $event.target.value)"
                                aria-label="Tarifa de elevación" aria-describedby="basic-addon1"
                                formControlName="valor">
                        </div>
                    </div>
                </ng-container>
            </div>
            <div class="col-md-8">
                <h5 class="font-weight-bold">Gastos</h5>
                <div class="row">
                    <ng-container *ngFor="let concepto of conceptosGastoFormArray.controls; let i = index">
                        <div class="col-md-6">
                            <div [formGroup]="concepto" class="form-group">
                                <label>{{ concepto.get('concepto.descripcion')?.value }}</label>
                                <div class="input-group mb-3">
                                    <div class="input-group-prepend">
                                        <div class="input-group-text">
                                            <input type="checkbox" formControlName="seleccionado"
                                                aria-label="Checkbox for following text input">
                                        </div>
                                    </div>
                                    <div class="input-group-prepend">
                                        <span class="input-group-text" id="basic-addon1">{{
                                            concepto.get('concepto.moneda.descripcion')?.value == "Dolares" ? "USD":
                                            "ARS"}}</span>
                                    </div>
                                    <input type="text" class="form-control" placeholder="Ingrese valor"
                                        (keypress)="numberWithTwoDecimals($event, $event.target.value)"
                                        aria-label="Tarifa de elevación" formControlName="valor"
                                        aria-describedby="basic-addon1">
                                </div>
                            </div>
                        </div>
                    </ng-container>
                </div>
            </div>
        </div>
        <div class="row mt-4 py-2">
            <div class="col text-right">
                <button type="button" class="btn btn-success" [disabled]="tarifaForm.get('cerrado')?.value == true" (click)="onGuardarTarifaProducto(false)">GUARDAR</button>
                <button type="button" class="btn btn-secondary ml-2"
                 [disabled]="tarifaForm.get('cerrado')?.value == true" (click)="onGuardarTarifaProducto(true)" >CERRAR</button>
            </div>
        </div>
    </div>
</form>
