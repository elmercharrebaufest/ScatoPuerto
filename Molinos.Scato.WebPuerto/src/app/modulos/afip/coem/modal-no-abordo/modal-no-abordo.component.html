<ship-spinner message="Enviando solicitud" *ngIf='cargando'></ship-spinner>
<div class="modal-content modal-solicitud">
  <div class="modal-header">
    <h5 class="modal-title">Solicitar No a bordo</h5>
    <button (click)="cerrarModal()" type="button" class="close" data-dismiss="modal" aria-label="Close">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div class="modal-body" *ngIf="coem">
    <form [formGroup]="form">
      <div class="table-responsive">
        <table class="table table-bordered">
          <thead class="thead-dark">
            <th></th>
            <th>CUIT ATA</th>
            <th>Peso (kg)</th>
            <th>Identificador de la declaración</th>
          </thead>
          <tbody formArrayName="declaraciones">
            <tr *ngFor="let declaracion of declaracionesFormArray.controls" [formGroup]="declaracion"
              [ngClass]="{'seleccionado': declaracion.get('seleccionado').value}">
              <td class="text-center">
                <input type="checkbox" formControlName="seleccionado">
              </td>
              <td>{{declaracion.get('cuit').value}}</td>
              <td>{{declaracion.get('peso').value}}</td>
              <td>{{declaracion.get('declaracion').value}}</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="row">
        <div class="col-3">
          <label>Motivo*</label>
          <select formControlName="codigoMotivo" class="form-control custom-select">
            <option *ngFor="let motivo of listaMotivos" [ngValue]="motivo.codigo">
              {{motivo.descripcion}}
            </option>
          </select>
        </div>
        <div class="col-9">
          <label>Detalle del motivo</label>
          <textarea formControlName="descripcionMotivo" class="form-control" maxlength="200"></textarea>
        </div>
      </div>
    </form>
  </div>
  <div class="modal-footer justify-content-center">
    <button type="button" class="btn btn-success" (click)="solicitarNoABordo()">Enviar solicitud</button>
    <button type="button" class="btn btn-danger" (click)="cerrarModal()">Cancelar</button>
  </div>
</div>
