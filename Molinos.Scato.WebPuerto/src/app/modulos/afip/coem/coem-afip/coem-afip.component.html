<ship-spinner [message]="'Cargando Historial de COEM. Por favor, espere...'"
    *ngIf='load'></ship-spinner>

<div style="overflow-x:auto;" class="table-responsive">
    <table class='table table-bordered lista-coem-table'>
        <thead class="lista-coem-header">
            <th>Id COEM</th>
            <th>Caratula</th>
            <th>Mercaderías Sueltas</th>
            <th>Estados</th>
            <th>Rectificar COEM</th>
            <th>Anular COEM</th>
        </thead>
        <tbody *ngFor="let historial of getListaHistorialCoem()">
            <tr class="lista-coem-row" >
                <td class="lista-coem-row-item">{{historial.identificadorCOEM}}</td>
                <td class="lista-coem-row-item">{{historial.identificadorCaratula}}</td>
                <td class="lista-coem-row-item">{{historial.mercaderiasSueltas[0].cuitATA}}</td>
                <td class="lista-coem-row-item">
                    <div class="btn-group">
                        <select class="custom-select" id="inputGroupSelect01" (change)="cambiarEstado($event,historial.id,historial.identificadorCOEM)" [disabled]="historial.afipCoemEstado.codigo=='ANU'">
                            <option selected value="" disabled>Estado</option>
                            <option *ngFor="let p of listaEstados" [value]="p.id" [selected]="historial.afipCoemEstado.id===p.id">{{p.codigo}}</option>
                          </select>
                    </div>
                </td>
                <td class="lista-coem-row-item">
                    <i class="fa fa-pencil fs-icon" aria-hidden="true" *ngIf="historial.afipCoemEstado.codigo!='ANU'" (click)="editarCoem(historial,editCoem)"></i>                   
                </td>
                <td class="lista-coem-row-item" >
                    <i class="fa fa-trash-o fs-icon" aria-hidden="true" *ngIf="historial.afipCoemEstado.codigo!='ANU'" (click)="eliminarCoem(historial.id, historial.identificadorCOEM)"></i>                                        
                </td>
            </tr>
        </tbody>
    </table>
</div>
<!-- <div *ngIf="esNoExisteRegistros">
    No se encontraron registros para los filtros ingresados.
</div>  -->

<!--Paginado -->
  <nav aria-label="Page navigation example" class="centrado">
        <ul class="pagination justify-content-center paginado-buque-fondo">
            <li [ngClass]="{'page-item disabled': currentPage === 1}">
                <a class="page-link" href="javascript:void(0);" (click)="goToPage(1)">
                << </a>
            </li>
            <li class="page-item" *ngIf="showEllipsisStart"><a class="page-link">...</a></li>
            <li *ngFor="let page of visiblePages"
                [ngClass]="{'page-item disabled': page == currentPage}">
                <a class="page-link" href="javascript:void(0);" (click)="goToPage(page)">{{ page }}</a>
            </li>
            <li class="page-item" *ngIf="showEllipsisEnd"><a class="page-link">...</a></li>
            <li [ngClass]="{'page-item disabled': currentPage === totalPages}">
                <a class="page-link" href="javascript:void(0);" (click)="goToPage(totalPages)"> >>
                </a>
            </li>
        </ul>
    </nav> 
    <!-- <div *ngIf="esNoExisteRegistros && ">
        No se encontraron registros para los filtros ingresados.
    </div>  -->





<ng-template #editCoem let-modal>
    <app-modal-crear-coem (editOCrearFinish)="editFinish($event)" [id]="coemId" [title]="'Rectificar Coem Nro '+ coemIdentificador"></app-modal-crear-coem>
</ng-template>
