 <form id="filtroForm">
<div class="row">
    <div class="form-group col-md-2 input_img">
        <input type="year" placeholder="Año" class="form-control" formControlName="anio">
      </div>
      <div class="form-group col-md-2 input_img">
        <input type="month" placeholder="Mes" class="form-control" formControlName="mes">
      </div>
      <div class="form-group col-md-2 colorGris">

        <ng-multiselect-dropdown  *ngIf="getListaBuques()"
                                 formControlName="buque" 
                                 [placeholder]="'Buque'"
                                 [settings]="getConfigListaMultiple()"
                                 [data]="getListaBuques()"                                    
                                >
        </ng-multiselect-dropdown>

    </div>
    <div class="form-group col-md-2 colorGris">

        <ng-multiselect-dropdown  *ngIf="getListaMuelleDeCarga()"
                                 formControlName="muelle" 
                                 [placeholder]="'Muelle de carga'"
                                 [settings]="getConfigListaMultiple()"
                                 [data]="getListaMuelleDeCarga()"                                    
                                >
        </ng-multiselect-dropdown>

    </div>
      <div class="form-group col-md-2 colorGris">

        <ng-multiselect-dropdown  *ngIf="getListaProductos()"
                                 formControlName="producto" 
                                 [placeholder]="'Producto'"
                                 [settings]="getConfigListaMultiple()"
                                 [data]="getListaProductos()"                                    
                                >
        </ng-multiselect-dropdown>

    </div>
    <div class="form-group col-md-1" >
        <button class="btn buscar" style="width: 100%;" (click)="onBuscar()">Buscar</button>
    </div>
    <div class="form-group col-md-2">
        <button class="btn limpiar" (click)="onLimpiarBusqueda()">Limpiar Búsqueda</button>
    </div>
</div>


</form>
