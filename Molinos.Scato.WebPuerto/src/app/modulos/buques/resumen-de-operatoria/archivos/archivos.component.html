<div class='bg-white shadow mt-4 px-4 pb-4'>
  <h4 class="info-header colorTitle pt-4">Archivos</h4>
  <hr class="solid">
 
  <div *ngIf="loaded" class="col-6" style="margin: 0 auto">      
    <div  style="display: flex; flex-direction: row; justify-content: space-between;margin-right:4px">
      <div>
        <h5 class="colorTitle">Archivos del embarque</h5>
      </div>
      <!-- SUBTITULO -->
      <div style="display: flex; flex-direction: row;">
          <h6 style="margin-right: 10px; margin-top:1px; color: #666666;">Seleccionar todos</h6>
          <div class="custom-control custom-switch">
            
            <input
              type="checkbox"
              class="custom-control-input"
              id="switchAllFiles"
              (change)="checkValue($event)"/>
            <label
              class="custom-control-label"
              for="switchAllFiles"
            ></label>
          </div>
      </div>
    </div>
    <br/>
    <div *ngIf="listArchivos != null && listArchivos.length > 0">
      <div *ngFor="let archivo of listArchivos;let i = index">
        <div   style="
          display: flex;
          flex-direction: row;
          justify-content: space-between;
          margin-bottom: 5px;"> 
          <input style="width: 22px; margin-right: 5px" [(ngModel)]="archivo.isSelected" (change)="checkChange()"   type="checkbox">
          <div style="display: flex;
                      align-content: space-evenly;
                      justify-content: space-between;
                      border-style: solid;
                      border-radius: 4px;
                      border-width: 1px;
                      border-color: lightgray;
                      padding: 2px;
                      flex: auto;">
            <label style="color: darkgray; margin-bottom: 0px; margin-left: 10px">{{archivo.tipoArchivoPuerto.tipoArchivo}}</label> 
            
            <label style="color: darkgray; margin-bottom: 0px; margin-right: 10px">.{{archivo.extension}}/{{archivo.size}} Kb</label>
          </div>

          <!-- Botonsitos -->
          <div>
            <img  src="assets\download.svg" class="buttonsStylesChetos"  (click)="downloadFile(archivo)"/>  
            <img src="assets\ojoIcon.svg" class="buttonsStylesChetos"  *ngIf='archivo.archivo.includes("data:image") || archivo.archivo.includes("data:application/pdf")' (click)="previewFile(previsualizeImageModal, archivo)"  />  
            <img src="assets\ojoIconGray.svg" class="buttonsStylesChetos"  (click)="previewFile(previsualizeImageModal, archivo)" *ngIf='!archivo.archivo.includes("data:image") && !archivo.archivo.includes("data:application/pdf")'/>            
            <img src="assets\trashIcon-no-border.svg" class="buttonsStylesChetos"  (click)="deleteFile(archivo)"/>
          </div>
        </div> 
      </div>
    </div>  
    <br/>
    <div style="display:flex; flex-direction: row;justify-content: space-evenly;">
      <button class="btn btn-outline-secondary" (click)="openAddFilesModal(addFiles)">Adjuntar archivos</button>
      <button *ngIf="!downloadSelectionActivated" disabled class="btn btn-success" >Descargar selección</button>
      <button *ngIf="downloadSelectionActivated"  class="btn btn-success" (click)="comprimirYDescargarSeleccion()">Descargar selección</button>

    </div>   
      <!-- <input [value]="a.tipoArchivoPuerto.tipoArchivo" *ngIf="a.id == null || a.id == 0" class="col-9" style="color: #5cb85c;" disabled/>
      <input [value]="a.tipoArchivoPuerto.tipoArchivo" *ngIf="a.id != null && a.id > 0" class="col-9" disabled/> -->
  </div>
</div>

<ng-template #previsualizeImageModal let-modal style="width: 800px;
align-self: center;">
  <div class="modal-content">
    <div class="modal-header">
      <h5 class="modal-title" style="color: #4d60A8;">Previsualización</h5>
    </div>
    <div class="modal-body" style="display: flex;
    justify-content: center;" >
      <img [src]="imagePath" style="width: 100%;" />
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-outline-grey" data-dismiss="modal" (click)="modal.close('cancelar')">Cerrar</button>
    </div>
  </div>
</ng-template>


<ng-template #addFiles let-modal style="width: 800px;
align-self: center;">
  <div class="modal-content" style="width: 700px; 
  align-self: center;">
    <div class="modal-header">
      <h5 class="modal-title" style="color: #4d60A8;">Adjuntar archivos</h5>
    </div>
    <!-- BODY -->
  <div class="modal-body">

      <div class="row" style="width: 100%;
      justify-content: space-evenly;
      margin: auto;">
        <div style="width: 15%; 
        display: flex;
      align-items: center;
      justify-content: center;">
          <label style="font-size: 23px; color: cadetblue;">
            1
          </label>
        </div>
        <!-- Selector de archivo -->
        <div style="width: 70%">
          <input  type="file" (change)="handleFileInput($event)">
        </div>
        <div style="width: 15%">
          <label style="font-size: 23px; color: cadetblue;">
            
          </label>
        </div>
      </div>

      <div class="row" fullWidth style="width: 100%;
                                        justify-content: space-evenly;
                                        margin: auto;" >
        <div style="width: 15%; display: flex;
                             align-items: center;
                            justify-content: center;">
          <label style="font-size: 23px; color: cadetblue; margin-bottom: 0px;">
            2
          </label>
        </div>
        <div style="display:flex; flex-direction: column; align-items: initial; width: 70%;">
          <div>
            <tag-input  
                    [(ngModel)]="nombreArchivo"
                    [placeholder]="'Nombre del archivo'"
                    [secondaryPlaceholder]="'Nombre del archivo'"
                    [identifyBy]="'id'"
                    [displayBy]="'tipoArchivo'"
                    [maxItems]="1"
                    (focusout)="tagInputLostFocus(nombreArchivo)">
              <tag-input-dropdown 
                      [appendToBody]="false"
                      [showDropdownIfEmpty]="true"
                      [autocompleteItems]="TipoArchivosDbList"
                      [identifyBy]="'id'"
                      [displayBy]="'tipoArchivo'">
              </tag-input-dropdown>
            </tag-input>
          </div>
          <div>
            <div fullWidth >        
              <label style="font-size: 9px; color: rgb(48, 48, 48);">
                Completar el nombre con el que desea guardar el documento.
              </label>
            </div>

          </div>
          
        </div>
        <div style="width: 15%; display: flex;
                            flex-direction: row;
                            align-content: center;
                            align-items: center;
                            justify-content: center;">
          <img src="assets/Mas.svg" class="cursorPointer" (click)="addFileToSave()" >          
        </div>
      </div>      
    </div>
    <br>

    <!-- ARCHIVOS A GUARDAR -->
    <div *ngIf="listArchivosToSave != null && listArchivosToSave.length > 0">
      <div *ngFor="let archivo of listArchivosToSave;let i = index">
        <div style="
          display: flex;
          flex-direction: row;
          justify-content: space-between;
          margin-bottom: 5px;
          margin-right: 15px;
          margin-left: 15px;"> 
          <div style="display: flex;
                      align-content: space-evenly;
                      justify-content: space-between;
                      border-style: solid;
                      border-radius: 4px;
                      border-width: 1px;
                      border-color: lightgray;
                      padding: 2px;
                      margin-right: 10px;
                      flex: auto;">
            <label style="color: darkgray; margin-bottom: 0px; margin-left: 10px">{{archivo.tipoArchivoPuerto.tipoArchivo}}</label> 
            
            <label style="color: darkgray; margin-bottom: 0px; margin-right: 10px">.{{archivo.extension}}/{{archivo.size}} Kb</label>
          </div>

          <!-- Botonsitos -->
          <div>
            <img src="assets\Menos.svg" buttonsStylesChetos (click)="deleteMemoryFile(archivo)"/>
          </div>
        </div> 
      </div>
    </div>
    <!-- FIN ARCHIVOS A GUARDAR -->
    <!-- FOOTER -->
    <div class="modal-footer">
      <button type="button" class="btn btn-outline-grey" data-dismiss="modal" (click)="modal.close('cancelar')">Cancelar</button>
      <button type="button" class="btn btn-primary" (click)=guardarArchivos() >Guardar</button>
    </div>
  </div>
</ng-template>
