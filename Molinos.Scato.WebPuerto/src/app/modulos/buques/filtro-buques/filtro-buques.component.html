

<div class="row">    
    <div class="col-md-9"><label class="titulo-historial-buque-letra">Historial de embarques</label></div>
    <div class="text-md-right margen-boton-buque col-md-3" style="margin-top: 10px;"> 
    </div>
</div>
<br>
<form id="filtroBuquedaForm" [formGroup]="getFiltroBuquedaForm()">
    <div class="form-row">
        <div class="form-group col-md-2 input_img">
            <input type="month" placeholder="Desde" class="form-control colorGris" [value]="desde" formControlName="desde">
          </div>
          <div class="form-group col-md-2 input_img">
            <input type="month" placeholder="Hasta" class="form-control colorGris" [value]="hasta" formControlName="hasta">
          </div>
        <div class="form-group col-md-2 colorGris">

            <ng-multiselect-dropdown  *ngIf="getListaProductos()"
                                     formControlName="producto" 
                                     [placeholder]="'Producto'"
                                     [settings]="getConfigListaMultiple()"
                                     [data]="getListaProductos()"                                    
                                    >
            </ng-multiselect-dropdown>
        </div>
        <div class="form-group col-md-2 colorGris">
            <ng-multiselect-dropdown *ngIf="getListaMuelles()" formControlName="muelle" [placeholder]="'Muelle'"
                [settings]="getConfigListaMultipleMuelles()" [data]="getListaMuelles()">
            </ng-multiselect-dropdown>
        </div>
        <div class="form-group col-md-2 colorGris">
            <input type="text" class="form-control" placeholder="Buque" formControlName="buque"
                >
        </div>
        <div class="form-group col-md-2 colorGris">
            <input type="text" class="form-control" placeholder="Destino" formControlName="destino"
               >
        </div>
        <div class="form-group col-md-2 colorGris">
            <input type="text" class="form-control" placeholder="Exportador" formControlName="nombreExportador"           
                >
        </div>
        <div class="form-group col-md-2 colorGris">
            <input type="text" class="form-control" title="Búsqueda por nombre o apellido." placeholder="Control privado" formControlName="control"
               >
        </div>    
        <div class="form-group col-md-1" >
            <button class="btn buscar" style="width: 100%;" (click)="onBuscar()" >Buscar</button>
        </div>
        <div class="form-group col-md-2">
            <button class="btn limpiar" (click)="onLimpiarFiltros()">Limpiar Búsqueda</button>
        </div>
    </div>

</form>
