

<div class="row">

    </div>
</div>

    <div class="form-row">

                <option *ngFor="let anio of getListaAnios()" [value]="anio.numeroAnio">{{anio.nombreAnio}}</option>
            </select>

        <div class="form-group col-md-2 input_img">
            <input type="month" placeholder="Desde" class="form-control colorGris" [value]="desde" formControlName="desde">

          <div class="form-group col-md-2 input_img">

          </div>
        <div class="form-group col-md-2 colorGris">

            <ng-multiselect-dropdown  *ngIf="getListaProductos()"
