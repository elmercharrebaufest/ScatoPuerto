<div class="mt-4 px-4 pb-4" style='background-color: white !important;'>
  <app-collapse-button collapseSelectorId="collapseLineasEmbarque"></app-collapse-button>
  <h4 class="colorTitle pt-4">Conformación de líneas de embarque</h4>
  <div id="collapseLineasEmbarque" class="collapse show">
    <div *ngIf="!esCalidad" fxLayout='row wrap' class="mt-3">
      <div fxFlex='100'>
        <div class='btn-add-container pt-btn-add' (click)="onAgregarLineasEmbarque()" id="btn-add-container-lineas">
          <ng-container *ngIf="hasPermisoLiquido_ConformacionLineasEmb_Editar()">
            <button type='button' class='btn btn-primary bt-circle ocultarPdf' style='margin-top: -5px; ' >+</button>
            <span class='txt-primary pl-10 mt-5 txt-action ocultarPdf'>Agregar nueva fila</span>
          </ng-container>
        </div>
      </div>
    </div>

    <table class="claseTable" >
      <div fxLayout='row wrap' class="mt-4">
        <div fxFlex='100'>
          <div fxLayout='row wrap' class="tituloCentrado" >
            <tr class="claseTr" >
              <th class="headerLineas">
                <div fxFlex='25'>

                </div>
                <div class="form-group div-active pl-2" fxFlex='34'>
                  <label>INICIAL</label>
                </div>
                <div class="form-group div-active pl-2" fxFlex='29'>
                  <label>FINAL</label>
                </div>
              </th>
              <th>
                <div class="form-group div-active pl-2" fxFlex='12'>
                  <label>Línea</label>
                </div>
                <div class="form-group div-active pl-2" fxFlex='12'>
                    <label>Producto</label>
                </div>
                <div class="form-group div-active pl-2" fxFlex='6'>
                  <label>Tk</label>
                </div>
                <div class="form-group div-active" fxFlex='4'>
                    <label>°C</label>
                </div>
                <div class="form-group div-active" fxFlex='7'>
                    <label>Altura (CM,MM)</label>
                </div>
                <div class="form-group div-active" fxFlex='6'>
                    <label>Densidad</label>
                </div>
                <div class="form-group div-active" fxFlex='6'>
                  <label>M3</label>
                </div>
                <div class="form-group div-active" fxFlex='6'>
                    <label>TN</label>
                </div>
                <div class="form-group div-active" fxFlex='4'>
                    <label>°C</label>
                </div>
                <div class="form-group div-active" fxFlex='7'>
                  <label>Altura (CM,MM)</label>
                </div>
                <div class="form-group div-active" fxFlex='6'>
                  <label>Densidad</label>
                </div>
                <div class="form-group div-active" fxFlex='6'>
                    <label>M3</label>
                </div>
                <div class="form-group div-active" fxFlex='6'>
                    <label>TN</label>
                </div>
                <div class="form-group div-active" fxFlex='7'>
                    <label>Salida Tk</label>
                </div>
                <div fxFlex='4' class='full-center' >
                </div>
              </th>
            </tr>
          </div>
        </div>
      </div>

      <div class='lineas-detalles'>
        <perfect-scrollbar>
          <form id="lineasDeEmbaque" [formGroup]="lineasDeEmbarqueForm" *ngIf="lineasDeEmbarqueForm">
            <ng-container formArrayName="lineasEmbarque">
              <ng-container *ngFor="let lineasE of lineasDeEmbarqueForm['controls']['lineasEmbarque']['controls']; let i = index" [formGroupName]="i" >
                <div fxLayout='row wrap' class="distancia-filas" >
                  <div fxFlex='100'>
                    <div fxLayout='row wrap'>

                      <tbody>
                        <tr class="claseTr" >
                          <td>

                            <div class="form-group pl-2" fxFlex='12'>
                                <select class="custom-select seleccionable"
                                        formControlName="tipoLineaEmbarque"
                                        (change)="onLineaSeleccionada(lineasE)"
                                        [compareWith]='compareLineaEmbarque'>
                                  <option *ngFor="let tipo of tipoLineaEmbarque" [ngValue]="tipo"> {{ tipo.linea }} </option>
                                </select>
                            </div>
                            <div class="form-group pl-2" fxFlex='12' (change)="onFocusOutEvent(i)">
                                <select class="custom-select seleccionable"
                                        formControlName="materialPuerto"
                                        [compareWith]="compareLineas">
                                  <option value="" selected></option>
                                  <option *ngFor="let p of materialesPuerto" [ngValue]="p"> {{ p.descripcionCorta }} </option>
                                </select>
                            </div>
                            <div class="form-group pl-2 pr-2" fxFlex='6'>
                                <select class="custom-select seleccionable"
                                        formControlName="tkInicial"
                                        #tanqueSelect
                                        [ngClass]='setClase(i)'
                                        [compareWith]='compareTanque'>
                                  <option *ngFor="let t of tanquesOption"
                                          [ngValue]="t"
                                          [ngClass]="t.color">
                                          {{ t.value }}
                                  </option>
                                </select>
                            </div>
                            <div class="form-group" fxFlex='4'>
                              <input type="text" (focusout)="onFocusOutEvent(i, lineasE)" class="inputLineasEmbarque" formControlName="temperaturaInicial"/>
                            </div>
                            <div class="form-group" fxFlex='7'>
                              <input type="text" class="inputLineasEmbarque" formControlName="alturaInicialCMyMM" (keypress)="validateMedicion($event, lineasE, true)" placeholder="CM,MM" (focusout)="onCalculaLitros(lineasE, true)"/>
                            </div>
                            <div class="form-group" fxFlex='6'>
                              <input type="text" class="inputLineasEmbarque" formControlName="densidadInicial" />
                            </div>
                            <div class="form-group" fxFlex='6'>
                              <input type="text" class="inputLineasEmbarque" formControlName="litros" />
                            </div>
                            <div class="form-group" fxFlex='6'>
                              <input type="text" class="inputLineasEmbarque" formControlName="kilos" />
                            </div>
                            <div class="form-group" fxFlex='4'>
                              <input type="text" class="inputLineasEmbarque" formControlName="temperaturaFinal" />
                            </div>
                            <div class="form-group" fxFlex='7'>
                              <input type="text" class="inputLineasEmbarque" formControlName='alturaFinalCMyMM' (keypress)="validateMedicion($event, lineasE, false)" (focusout)="onCalculaLitros(lineasE, false)"/>
                            </div>
                            <div class="form-group" fxFlex='6'>
                              <input type="text" class="inputLineasEmbarque" formControlName="densidadFinal" />
                            </div>
                            <div class="form-group" fxFlex='6'>
                              <!-- <input type="text" class="inputLineasEmbarque" formControlName="litrosFinales" /> -->
                              <input type="text" disabled class="inputLineasEmbarque" formControlName="litrosFinales" />
                            </div>
                            <div class="form-group" fxFlex='6'>
                              <input type="text" disabled class="inputLineasEmbarque" formControlName="kilosFinales"/>
                              <!-- <input type="text" class="inputLineasEmbarque" formControlName="kilosFinales"/> -->
                            </div>
                            <div class="form-group" fxFlex='7'>
                              <input type="text" class="inputLineasEmbarque" formControlName="tkFinal" />
                            </div>

                            <div *ngIf="!esCalidad" fxFlex='4' class='full-center btn-eliminar ocultarPdf'>
								<ng-container *ngIf="hasPermisoLiquido_ConformacionLineasEmb_Eliminar()" >
                                	<img id="btn-eliminar-lineas" src="assets/trashIcon.svg" class="basurerito" (click)="onEliminarLineasEmbarque(i)">
                            	</ng-container>
                            </div>

                          </td>
                        </tr>
                      </tbody>

                    </div>
                  </div>
                  <i class='fas fa-angle-down float-down-arrow' *ngIf='i > 7'></i>
                </div>
              </ng-container>
            </ng-container>
          </form>
        </perfect-scrollbar>
      </div>
    </table>
    <br/>
    <div *ngIf="!esCalidad" class="text-center">
    	<ng-container *ngIf="hasPermisoLiquido_ConformacionLineasEmb_Editar()">
			<button id="guardar-conformacion-lineas-embarque" type="button" class="btn btn-primary"
			(click)="onGuardar()"
			[disabled]="!esGuardadoActivo" >GUARDAR</button>
   		</ng-container>
   </div>
  </div>
</div>
