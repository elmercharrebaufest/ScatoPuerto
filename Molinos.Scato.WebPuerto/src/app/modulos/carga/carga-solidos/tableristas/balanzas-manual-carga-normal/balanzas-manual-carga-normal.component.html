<div class="modal-dialog" role="document">
    <div class="modal-content" *ngIf="cargaNormalForm">
        <form [formGroup]="cargaNormalForm">
            <div class="modal-header">
                <div class="col">
                    <div class="row flex-between">
                        <h4 class="modal-title" id="modal-basic-title">Carga Normal - Balanza {{numeroBalanza}}</h4>
                    </div>
                    <div class="row">
                        <div class="col">
                            <label>Inicio</label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col">
                            <input type="date" min="{{fechaComienzoCarga}}" class="form-control"
                                (change)="onCambiarHoras(false)" formControlName="fechaInicio" />
                        </div>
                        <div class="col">
                            <div class='input_img' style="display: flex;">
                                <input placeholder="00:00" [ngxTimepicker]='horaInicio' formControlName="horaInicio"
                                    min="{{horaInicioMinimo}}" max="{{horaInicioMaximo}}"
                                    [format]='24' class='form-control w-100' style="margin-right: 5px;"
                                    (click)="onCambiarHoras(false)">
                                <img src='assets/reloj.svg' class='imgClockInput1'>
                            </div>
                            <ngx-material-timepicker #horaInicio></ngx-material-timepicker>
                        </div>
                    </div>
                    <div class="row mt-3" *ngIf="!this.cargaNormalForm.controls.recordatorio.value || balanzaManualRegistro != null">
                        <div class="col">
                            <label>Corte</label>
                        </div>
                    </div>
                    <div class="row" *ngIf="!this.cargaNormalForm.controls.recordatorio.value || balanzaManualRegistro != null">
                        <div class="col">
                            <input type="date" min="{{fechaComienzoCarga}}" class="form-control"
                            (change)="onCambiarHoras(true)" formControlName="fechaCorte" />
                        </div>
                        <div class="col">
                            <div class='input_img' style="display: flex;">
                                <input id="horaCorte" placeholder="00:00" [ngxTimepicker]='horaCorte' formControlName="horaCorte"
                                    [format]='24' class='form-control w-100' style="margin-right: 5px;"
                                    (click)="onCambiarHoras(true)">
                                <img src='assets/reloj.svg' class='imgClockInput1'>
                            </div>
                            <ngx-material-timepicker #horaCorte></ngx-material-timepicker>
                        </div>
                    </div>
                    <div *ngIf="balanzaManualRegistro == null" class="row mt-3">
                        <div class="col">
                            <div class="form-check">
                                <label>
                                    <input type="checkbox" formControlName="recordatorio">
                                    Recordatorio
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class='modal-body'>
                    <div class="row mt-3">
                        <div class="col">
                            <label>Bodega</label>
                            <select class="custom-select w-100" formControlName="bodega"
                                [compareWith]="compareBodegasParcel">
                                <option value="" selected disabled>Seleccione</option>
                                <option *ngFor='let bodega of bodegas' [ngValue]='bodega'>
                                    {{bodega.nombre}} </option>
                            </select>                            
                        </div>
                    </div>                
                    <div class="row mt-3">
                        <div class="col">
                            <label>Observaciones</label>
                            <textarea rows='5' class="w-100" formControlName="observaciones"  maxlength="500"></textarea>
                        </div>
                    </div>
            </div>
            <div class="modal-footer" style="display: flex;justify-content: space-between;margin-left: 20px;margin-right: 20px;">
                <button class='btn btn-outline-danger' (click)='onCerrarModal()'>Cancelar</button>
                <button class='btn btn-primary' (click)='onGuardarModalCargaNormal()'>Guardar</button>
            </div>
        </form>
    </div>
</div>
