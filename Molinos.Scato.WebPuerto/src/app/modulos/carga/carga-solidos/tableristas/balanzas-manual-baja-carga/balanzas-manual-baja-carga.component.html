<div class="modal-dialog" role="document">
    <div class="modal-content">
        <form [formGroup]="bajaCargaForm">
            <div class="modal-header">
                <div class="col">
                    <div class="row flex-between">
                        <h4 class="modal-title" id="modal-basic-title">Baja Carga - Balanza {{numeroBalanza}}</h4>
                    </div>
                    <div class="row">
                        <div class="col">
                            <label>Inicio</label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col">
                            <input type="date" min="{{fechaComienzoCarga}}" class="form-control"
                                (change)="onCambiarHoras(false)" formControlName="fechaInicio" />
                        </div>
                        <div class="col">
                            <div class='input_img' style="display: flex;">
                                <input placeholder="00:00" [ngxTimepicker]='horaInicio' formControlName="horaInicio"
                                    min="{{horaInicioMinimo}}" max="{{horaInicioMaximo}}"
                                    (click)="onCambiarHoras(false)" 
                                    [format]='24' class='form-control w-100' style="margin-right: 5px;">
                                <img src='assets/reloj.svg' class='imgClockInput1'>
                            </div>
                            <ngx-material-timepicker #horaInicio></ngx-material-timepicker>
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col">
                            <label>Corte</label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col">
                            <input type="date" min="{{fechaComienzoCarga}}" class="form-control"
                            (change)="onCambiarHoras(true)" formControlName="fechaCorte" />
                        </div>
                        <div class="col">
                            <div class='input_img' style="display: flex;">
                                <input placeholder="00:00" [ngxTimepicker]='horaCorte' formControlName="horaCorte"
                                    (click)="onCambiarHoras(true)" 
                                    [format]='24' class='form-control w-100' style="margin-right: 5px;">
                                <img src='assets/reloj.svg' class='imgClockInput1'>
                            </div>
                            <ngx-material-timepicker #horaCorte></ngx-material-timepicker>
                        </div>
                    </div>
                </div>
            </div>
            <div class='modal-body'>
                <div class="col">
                    <div class="row mt-3">
                        <div class="col">
                            <label>Bodega</label>
                            <select class="custom-select w-100" formControlName="bodega"
                                [compareWith]="compareBodegasParcel" (change)="onCargarMaterialPorBodegas()">
                                <option value="" selected disabled>Seleccione</option>
                                <option *ngFor='let bodega of bodegas' [ngValue]='bodega'>
                                    {{bodega.nombre}} </option>
                            </select>                            
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col">
                            <label>Producto</label>
                            <select class="custom-select w-100" formControlName="material"
                                [compareWith]="compareMaterialPuerto" disabled="true">
                                <option value="" selected disabled>Seleccione</option>
                                <option *ngFor='let material of materialesPuerto' [ngValue]='material'>
                                    {{material.descripcionCorta}} </option>
                            </select>
                        </div>
                        <div class="col">
                            <label>Kg</label>
                            <input type="number" class="form-control" 
                                   formControlName="kilogramos" step="0.001" 
                                   min="0" max="9999999.999"
                                   (change)="onKilosChange($event)"/>
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col">
                            <label>Motivo</label>
                            <select class="custom-select w-100" formControlName="motivosFallasBalanza"
                                [compareWith]="compareMotivosBalanzas">
                                <option value="" selected disabled>Selecciona un Motivo</option>
                                <option *ngFor='let motivo of motivosBalanzas78' [ngValue]='motivo'>
                                    {{motivo.siglas}}
                                    - {{motivo.nombre}} </option>
                            </select>
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col">
                            <label>Observaciones</label>
                            <textarea rows='5' class="w-100" formControlName="observaciones" maxlength="500"></textarea>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class='btn btn-outline-danger' data-dismiss="modal" (click)='onCerrarModal()'>Cancelar</button>
                <button class='btn btn-primary' (click)='onGuardarModalCorteManual()'>Guardar</button>
            </div>
        </form>
    </div>
</div>
