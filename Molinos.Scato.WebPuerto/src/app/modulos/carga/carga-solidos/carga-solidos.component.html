<div id="imprimirCargaSolidos">
  <div id="element-to-hide" data-html2canvas-ignore="true">
    <ship-spinner *ngIf='cargaPdf' [src]='"pdf"'></ship-spinner>
  </div>

  <app-grafico-carga id='graficoCargaCanva' class='bg-white'></app-grafico-carga>
  <app-manos [celdasManoDeEmbarque]="celdasManoDeEmbarque" [sentidosManoDeEmbarque]="sentidosManoDeEmbarque"></app-manos>

  <div data-html2canvas-ignore="true" class="d-flex justify-content-center my-5" *ngIf="!mostrarTableristaOperando">
    <ng-container *ngIf="hasPermisoPlanoDeCarga_Cancelar()">
      <button type="button" class="btn btn-danger" [routerLink]="['/lineup']">CANCELAR</button>
    </ng-container>
    <ng-container *ngIf="hasPermisoPlanoDeCarga_Guardar()">
      <button type="button" class="btn btn-primary mx-5" [disabled]="estaGuardando" (click)="guardar(false)">GUARDAR</button>
    </ng-container>
    <ng-container *ngIf="hasPermisoPlanoDeCarga_Imprimir()">
	    <img src="./assets/boton_imprimir.svg" (click)="imprimir()" style="cursor: pointer;"/>
    </ng-container>
    <ng-container *ngIf="hasPermisoEnviarATablerista()">
      <button type="button" class="btn btn-success mx-5" [disabled]="estaGuardando" (click)="guardar(true)">ENVIAR A TABLERISTA</button>
		</ng-container>
  </div>

  <div *ngIf="mostrarTableristaOperando" class="html2pdf__page-break"></div>

  <div *ngIf="mostrarTableristaOperando">
    <app-amarre-nuevo [ModuloDeCargaId]="this.embarqueSelected.moduloDeCargaId" (inicioCarga)="obtenerInicioCarga($event)"></app-amarre-nuevo>
  </div>

  <div *ngIf="mostrarTableristaOperando">
    <div id="umap">
      <app-umap #umapComponent [ModuloDeCargaId]="this.embarqueSelected.moduloDeCargaId"></app-umap>
    </div>
    <div>
      <!-- <app-inicio-carga (inicioCarga)="obtenerInicioCarga($event)"></app-inicio-carga> -->
      <div *ngIf="!ingresoManualSolido && !existeFechasPeriodoDeCarga" class="html2pdf__page-break"></div>
      <div *ngIf="!ingresoManualSolido && !existeFechasPeriodoDeCarga" class="html2pdf__page-break"></div>
      <div *ngIf="!ingresoManualSolido && !existeFechasPeriodoDeCarga && mostrarTableristaOperando && inicioCarga " class="html2pdf__page-break"></div>

      <app-balanzas *ngIf="moduloDeCarga && !ingresoManualSolido && !existeFechasPeriodoDeCarga" [imprimir]="imprimir"></app-balanzas>

      <app-balanzas-manual *ngIf="moduloDeCarga && ingresoManualSolido && existeFechasPeriodoDeCarga"></app-balanzas-manual>
      <app-fumigacion-bodega *ngIf="moduloDeCarga && ingresoManualSolido" [ModuloDeCargaId]="this.embarqueSelected.moduloDeCargaId" [esSoloLectura]="false"></app-fumigacion-bodega>

      <!-- <app-finalizacion-carga *ngIf="moduloDeCarga && ingresoManualSolido && existeFechasPeriodoDeCarga"
        (finalizacionCarga)="obtenerFinalizacionCarga($event)"></app-finalizacion-carga> -->
    </div>

    <ng-container *ngIf="hasPermisoTableroSolido_VerRitmosEmbarqueBlzas78()">
      <app-balanzas-ritmos *ngIf="moduloDeCarga && !ingresoManualSolido && !existeFechasPeriodoDeCarga"></app-balanzas-ritmos>
    </ng-container>

    <ng-container *ngIf="hasPermisoTableroSolido_VerCargasBodegas()">
      <app-bodegas *ngIf="moduloDeCarga && !ingresoManualSolido && !existeFechasPeriodoDeCarga"></app-bodegas>
    </ng-container>

    <div *ngIf="!ingresoManualSolido && !existeFechasPeriodoDeCarga && mostrarTableristaOperando && inicioCarga " class="html2pdf__page-break"></div>

    <div class="row mt-3" *ngIf="moduloDeCarga && !ingresoManualSolido && !existeFechasPeriodoDeCarga">
      <div class="col espacio-izq">
        <ng-container *ngIf="hasPermisoTableroSolido_VerRitmos()">
          <app-graficos-ritmos></app-graficos-ritmos>
        </ng-container>
      </div>
      <div class="col">
        <ng-container *ngIf="hasPermisoTableroSolido_VerInformacionAdicional()">
          <app-info-adicional></app-info-adicional>
        </ng-container>
      </div>
    </div>

    <div data-html2canvas-ignore="true" class="d-flex justify-content-center my-5">
      <ng-container *ngIf="hasPermisoPlanoDeCarga_Cancelar()">
        <button type="button" class="btn btn-danger" [routerLink]="['/lineup']">CANCELAR</button>
      </ng-container>
      <ng-container *ngIf="hasPermisoPlanoDeCarga_Guardar()">
        <button type="button" class="btn btn-primary mx-5" [disabled]="estaGuardando" (click)="guardar(false)">GUARDAR</button>
      </ng-container>
      <ng-container *ngIf="hasPermisoPlanoDeCarga_Imprimir()">
	      <img src="./assets/boton_imprimir.svg" (click)="imprimir()" style="cursor: pointer;"/>
      </ng-container>
      <ng-container *ngIf="hasPermisoPlanoDeCarga_Finalizar()">
        <button type="button" class="btn btn-success mx-5" [disabled]="estaGuardando" (click)="guardar(true)">FINALIZAR (Reenviar a tablerista)</button>
			</ng-container>
    </div>
  </div>
</div>
