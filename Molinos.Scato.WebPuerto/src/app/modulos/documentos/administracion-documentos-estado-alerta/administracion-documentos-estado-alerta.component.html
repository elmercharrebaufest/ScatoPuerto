<div class="margenes cierre">
    <button type="button" class="close" aria-label="Close" (click)="onCerraModal()">
        <span aria-hidden="true" style="font-size: 35px;">&times;</span>
    </button>
    <label><strong class="titulo">Generación de alerta</strong></label>
</div>
<div class="line"></div>
<div class="modal-body cuerpoMail">
    <div [formGroup]="documentoAlertaForm">
        <div class="row" style="display: flex;align-items: center;margin-bottom: 5px;">
            <div class="col-md-2">
                <strong style="height: min-content;">Destinatarios:</strong>
            </div>
            <div class="col-md-10">
                <tag-input formControlName="destinatarios" [modelAsStrings]="true" [placeholder]="'Destinatarios'"
                    [secondaryPlaceholder]="'Destinatarios'" [validators]="validators"></tag-input>
            </div>
        </div>
        <div class="row" style="display: flex;align-items: center;margin-bottom: 5px;">
            <div class="col-md-2">
                <strong style="height: min-content;">Motivo:</strong>
            </div>
            <div class="col-md-10">
                <select formControlName="motivo" class="custom-select" (change)="onSeleccionaMotivo()">
                    <option value="0" default selected>Seleccione</option>
                    <option *ngFor="let motivoAlerta of listaMotivoAlerta" [ngValue]="motivoAlerta">
                        {{motivoAlerta.motivo}}
                    </option>
                </select>
            </div>
        </div>
        <div class="row" *ngIf="mostrarSeccionOtros" style="display: flex;align-items: center;margin-bottom: 5px;">
            <div class="col-md-2" style="display: flex;align-items: center;">
                <strong style="height: min-content;">Descripción</strong>
            </div>
            <div class="col-md-10">
                <input type="text" maxlength="60" class="form-control" formControlName="motivoDescripcion" (change)="onCompletarAsunto()">
            </div>
        </div>
        <div class="row" style="display: flex;align-items: center;margin-bottom: 5px;">
            <div class="col-md-2">
                <strong>Asunto:</strong>
            </div>
            <div class="col-md-10">
                <input type="text" class="form-control" formControlName="asunto">
            </div>
        </div>
        <div class="row" style="display: flex;align-items: center;margin-bottom: 5px;">
            <div class="col-md-2">
                <strong>Comentario:</strong>
            </div>
            <div class="col-md-10">
            </div>            
        </div>
        <div class="row" style="display: flex;align-items: center;margin-bottom: 5px;">
            <div class="col-md-12">
                <ckeditor [editor]="Editor" formControlName="comentario" (ready)="onReady($event)"
                style="border: 0px solid #ccc!important;"></ckeditor>
            </div>            
        </div>              
    </div>
</div>
<div class="modal-footer">
    <button type="button" ngbAutofocus class="btn btn-primary" (click)="onEnviarNotificacion()">Enviar
        Notificación</button>
</div>
