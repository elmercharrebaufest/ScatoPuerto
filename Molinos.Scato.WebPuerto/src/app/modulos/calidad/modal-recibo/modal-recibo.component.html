<button
  (click)="openModalEmitirRecibo(emitirRecibo)"
  class="btn btn-primary m-4"
  *ngIf="!mostrarModal"
>
  EMITIR RECIBO
</button>



<ng-template #emitirRecibo let-modal>
  <form [formGroup]="reciboDeBuqueForm">
    <div class="modal-header">
      <label><b>Por favor, verifique los datos del recibo.</b></label>
    </div>
    <div class="modal-body">
      <div class="row">
        <div class="col">
          <label for="recipient-name" class="col-form-label"
            ><b>Port of</b><br /><span class="Traduccion"
              >puerto de</span
            ></label
          >
          <input
            type="text"
            class="form-control"
            uppercase
            formControlName="puertoOrigen"
          />
        </div>
        <div class="col">
          <label for="recipient-name" class="col-form-label"
            ><b>Date</b><br /><span class="Traduccion"> fecha </span></label
          >
          <input
            type="date"
            max="3000-12-31"
            min="1000-01-01"
            class="form-control fecha"
            formControlName="fechaRecibo"
          />
          <!-- value="{{this.reciboBuqueDetalles.fechaRecibo}}" -->
        </div>
      </div>

      <div><label></label></div>

      <div class="row">
        <div class="col">
          <label for="recipient-name" class="col-form-label"
            ><b>Recived, in board the M/V/</b><br /><span class="Traduccion">
              Recibido a bordo del vapor</span
            ></label
          >
          <input
            type="text"
            class="form-control"
            formControlName="nombreBuque"
          />
        </div>
        <div class="col"></div>
      </div>

      <div><label></label></div>

      <div>
        <label for="recipient-name"
          ><b
            >the under noted goods in apparent good order and confition form/</b
          ><br /><span class="Traduccion">
            las mercaderías abajo mencionadas en aparente buen orden y condcion
            de</span
          ></label
        >
      </div>

      <div class="row">
        <div class="col">
          <input
            type="text"
            class="form-control"
            uppercase
            formControlName="exportador"
          />
        </div>
        <div class="col"></div>
      </div>

      <div><label></label></div>

      <div class="row">
        <div class="col">
          <label for="recipient-name" class="col-form-label"
            ><b>for the Port of</b><br /><span class="Traduccion">
              para el puerto de</span
            ></label
          >

          <input
            type="text"
            class="form-control"
            formControlName="puertoDestino"
          />
        </div>
        <div class="col">
          <div>
            <label for="recipient-name" class="col-form-label"
              ><b>Incluir para impresión</b></label
            >
          </div>
          <div class="custom-control custom-switch">
            <input
              type="checkbox"
              class="custom-control-input"
              id="customSwitchDestino"
              checked
              formControlName="incluirImpresionDestino"
            />
            <label
              class="custom-control-label"
              for="customSwitchDestino"
            ></label>
          </div>
        </div>
      </div>

      <div><label></label></div>

      <div>
        <label for="recipient-name" class="col-form-label"
          ><small
            >(Quantity to be stated in Figures and also in Words).(Cantidades
            establecidas en números y tambien en letras)</small
          ></label
        >
      </div>

      <div class="row">
        <div class="col">
          <label for="recipient-name" class="col-form-label"
            ><b>QUANTITY</b
            ><span class="Traduccion"
              ><br />
              CANTIDAD</span
            ></label
          >

          <input
            type="number"
            class="form-control inputCantidad"
            formControlName="cantidad"
            (change)="
              onChangeCantidadEnLetras(
                this.reciboDeBuqueForm.controls.cantidad.value
              )
            "
          />
        </div>
        <div class="col cantidadLetras">
          <label for="recipient-name" class="col-form-label"
            ><b>QUANTITY IN WORDS AND CLASS OF CARGO</b><br /><span
              class="Traduccion"
            >
              CANTIDAD EN LETRAS Y CLASE DE CARGA</span
            ></label
          >
          <textarea
            class="form-control resizeArea"
            rows="2"
            cols="50"
            formControlName="cantidadLetrasYClaseCarga"
          ></textarea>
        </div>
      </div>

      <div><label></label></div>

      <div class="row">
        <div class="col">
          <div>
            <label for="recipient-name" class="col-form-label"
              ><b>Stowed </b><br /><span class="Traduccion"
                >Estibado en bodega</span
              ></label
            >
          </div>
          <input
            type="text"
            class="form-control"
            formControlName="estibadoEnBodega"
          />
        </div>
        <div class="col">
          <div>
            <label for="recipient-name" class="col-form-label"
              ><b>Incluir para impresión</b></label
            >
          </div>
          <div class="custom-control custom-switch">
            <input
              type="checkbox"
              class="custom-control-input"
              id="customSwitchBodega"
              checked
              formControlName="incluirImpresionEstibado"
            />
            <label
              class="custom-control-label"
              for="customSwitchBodega"
            ></label>
          </div>
        </div>
      </div>

      <div><label></label></div>

      <div class="row">
        <div class="col">
          <div>
            <label for="recipient-name" class="col-form-label"
              ><b>Quality and Quantity unknown Said to Weigh:</b><br /><span
                class="Traduccion"
              >
                Calidad y cantidad desconocidas que se dice pasar</span
              ></label
            >
          </div>
          <input
            type="text"
            class="form-control"
            formControlName="calidadYCantidadDesconocida"
          />
        </div>
        <div class="col">
          <div>
            <label for="recipient-name" class="col-form-label"
              ><b>Incluir para impresión</b></label
            >
          </div>
          <div class="custom-control custom-switch">
            <input
              type="checkbox"
              class="custom-control-input"
              id="customSwitchCalidad"
              checked
              formControlName="incluirImpresionCalidad"
            />
            <label
              class="custom-control-label"
              for="customSwitchCalidad"
            ></label>
          </div>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button
        type="button"
        class="btn btn-danger mx-5"
        (click)="modal.dismiss('Cross click')"
      >
        CANCELAR
      </button>
      <button
        type="button"
        class="btn btn-success"
        (click)="guardarRecibo()"
        (click)="modal.dismiss('Cross click')"
      >
        CONFIRMAR DATOS
      </button>
      <!-- <button
        *ngIf="enviado"
        type="button"
        class="btn btn-success"
        (click)="guardarRecibo()"
        (click)="modal.dismiss('Cross click')"
      >
        CONFIRMAR DATOS
      </button> -->
    </div>
  </form>
</ng-template>
