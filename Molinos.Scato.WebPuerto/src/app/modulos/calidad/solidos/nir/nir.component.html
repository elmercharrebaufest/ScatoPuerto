<div class="mt-4 px-4 pb-4 shadow" style="background-color: white;">
    <h4 class="colorTitle pt-4">Nir: {{tipoMaterial}}</h4>
    <form [formGroup]="nirForm">
        <table class="table table-bordered">
            <thead>
                <tr class="table-active">
                    <th scope="col" *ngFor="let item of headersTabla; let i=index">{{item}}</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td scope="col" *ngFor="let item of formControlNames; let i=index"><input [formControlName]='item'/></td>
                </tr>
            </tbody>
        </table>
        <div *ngIf="tipoMaterial == 'Trigo'">Total Ponderado Prot. B/S:</div>
    </form>
</div>
