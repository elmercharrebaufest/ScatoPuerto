<div id="imprimirRecibidoresSolido">
    <div id="element-to-hide" data-html2canvas-ignore="true">
        <ship-spinner *ngIf='RecibidoresPdf' [src]='"pdf"'></ship-spinner>
    </div>
    <app-grafico-carga id='graficoCargaCanva' 
                       class='bg-white'
                       [esCalidad]="true"></app-grafico-carga>

    <app-manos [celdasManoDeEmbarque]="celdasManoDeEmbarque" 
               [sentidosManoDeEmbarque]="sentidosManoDeEmbarque"
               [esCalidad]="true"></app-manos>

    <div class="html2pdf__page-break"></div>

    <div class='bg-white px-4 min-h5 shadow mt-4'>
        <app-planilla-turnos-solido></app-planilla-turnos-solido>
    </div>

    <div data-html2canvas-ignore="true" class="col text-center">
        <app-modal-recibo></app-modal-recibo>
    </div>

    <app-registro-recibos></app-registro-recibos>

    <div class="html2pdf__page-break"></div>

    <app-nir></app-nir>
    
    <div class="html2pdf__page-break"></div>

    <app-balanzas-ritmos></app-balanzas-ritmos>

    <div fxLayout='row wrap' class="mt-4 shadow" >
        
        <div fxFlex='50'>
            <!-- <app-graficos-ritmos [liquido]='embarqueSelected.esLiquido'></app-graficos-ritmos> -->
        </div>
        <div fxFlex='50' class='pb-3'>
            <app-info-adicional></app-info-adicional>
        </div>
    </div>
    <div data-html2canvas-ignore="true" class="d-flex justify-content-center my-5">
        <button class="btn btn-secondary" (click)="imprimir()">IMPRIMIR</button>
    </div>
</div>
